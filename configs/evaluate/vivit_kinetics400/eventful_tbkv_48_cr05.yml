# TempoMem (EventfulTBKV, cache_reuse=0.5) on top of Eventful r=48.
# Mirrors eventful_tbkv.yml (the r=24 TempoMem run) but with token_top_k=48 and
# the temporal_48 fine-tuned checkpoint, so it pairs with the full-dataset
# Eventful r=48 run (eventful_tbkv_48.yml, cache_reuse=0.0).
_defaults:
  - "_base.yml"
  - "_temporal.yml"
token_top_k: [48]
weights: "weights/vivit_b_kinetics400_final_48.pth"
model:
  spatial_config:
    block_class: "EventfulTBKVBlock"
    block_config:
      matmul_2_cast: "float16"
      cache_reuse: 0.5      # fraction of Eventful's proposed tokens dropped when cache-matched
      merge_iterations: 4
      merge_ratio: 0.5
      caching: true
