_defaults:
  - "configs/models/vivit_b_kinetics400.yml"
_output: "results/evaluate/vivit_kinetics400/${_name}/"
model:
  spatial_config:
    block_config:
      enable_object_cache: true
      cluster_similarity_threshold: 0.6
      offset_window_size: 3.0
      object_match_threshold: 0.55
      object_merge_ratio: 0.5
      track_eviction_patience: 4
      merging_iterations: 2
      caching: false
  temporal_config:
    block_config:
      enable_object_cache: false
