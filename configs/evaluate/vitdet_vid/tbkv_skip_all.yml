# TBKV token-skip on ALL blocks (not just the 4 global ones).
# Without tbkv_all_blocks, TBKV only touches window_size=None blocks --
# 4 of 12 in ViTDet-B -- capping any saving at ~33%.
_defaults:
  - "_size_672.yml"
  - "_half.yml"
vanilla: true
model:
  backbone_config:
    block_config:
      merging_iterations: 3
      r_match: 0.8
      bg_ratio: 0.6
      caching: true
      token_skip: true
      tbkv_all_blocks: true
      secondary: "none"
      secondary_keep: 0.5
