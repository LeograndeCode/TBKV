# TBKV on background tokens (K/V cache) + tome on foreground tokens.
# Each token is reduced by exactly one mechanism; see src/reduction/.
_defaults:
  - "_tbkv.yml"
weights: "weights/vivit_b_kinetics400.pth"
model:
  spatial_config:
    block_config:
      fg_reducer: "tome"
      fg_reducer_args:
        r: 8
